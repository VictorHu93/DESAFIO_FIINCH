<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de PDFs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h2>Upload de Processos Jurídicos (PDFs)</h2>
        <form id="uploadForm" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="arquivo" class="form-label">Selecione de 1 a 5 PDFs:</label>
                <input class="form-control" type="file" name="arquivo" id="arquivo" multiple accept=".pdf">
                <small class="text-muted">Pode selecionar até 5 arquivos. Apenas PDFs são permitidos.</small>
            </div>
            <button type="submit" class="btn btn-primary" id="uploadButton">Enviar</button>
        </form>
        <div class="mt-3" id="messages"></div>
    </div>

    <script>
        $(document).ready(function () {
            $("#uploadForm").submit(function (event) {
                event.preventDefault(); // Impede o reload da página
                
                const files = $("#arquivo")[0].files;
                if (files.length === 0) {
                    $("#messages").html(`<div class="alert alert-danger">Por favor, selecione pelo menos um arquivo.</div>`);
                    return;
                }

                if (files.length > 5) {
                    $("#messages").html(`<div class="alert alert-danger">Você só pode enviar até 5 arquivos por vez.</div>`);
                    return;
                }

                // Atualizar botão para indicar processamento
                const uploadButton = $("#uploadButton");
                uploadButton.prop("disabled", true).text("Enviando...");

                const formData = new FormData(this);

                $.ajax({
                    url: "{% url 'upload_pdfs' %}",
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (response) {
                        uploadButton.prop("disabled", false).text("Enviar");

                        if (response.success) {
                            $("#messages").html(`<div class="alert alert-success">${response.message}</div>`);

                            if (response.planilha_atualizada) {
                                alert("Planilha atualizada com novos dados!"); // Exibe o popup
                            }
                        } else {
                            $("#messages").html(`<div class="alert alert-danger">${response.message}</div>`);
                        }
                    },
                    error: function () {
                        uploadButton.prop("disabled", false).text("Enviar");
                        $("#messages").html(`<div class="alert alert-danger">Erro no envio dos arquivos.</div>`);
                    }
                });
            });
        });
    </script>
</body>
</html>
